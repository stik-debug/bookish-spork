{% extends "base.html" %}
{% block title %}Create Chama{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card p-4">
<h4>Create Chama</h4>
<p class="small text-muted">{{ trial }} days free on any plan</p>
<form method="POST">
<div class="mb-3"><label class="form-label">Chama name *</label>
<input name="name" class="form-control" required placeholder="e.g. Umoja Women Group"></div>
<div class="mb-3"><label class="form-label">Description</label>
<textarea name="description" class="form-control" rows="2"></textarea></div>
<div class="mb-3"><label class="form-label">Plan</label>
{% for key, p in plans.items() %}
<div class="form-check border rounded p-2 mb-1">
<input class="form-check-input" type="radio" name="plan" id="plan_{{ key }}" value="{{ key }}" {% if key=='basic' %}checked{% endif %}>
<label class="form-check-label w-100" for="plan_{{ key }}">
<strong>{{ p.name }}</strong> — KES {{ "{:,.0f}".format(p.price) }}/mo
<span class="text-muted small">(up to {{ p.max_members }} members)</span>
</label>
</div>
{% endfor %}
</div>
<div class="mb-3"><label class="form-label">Monthly contribution (KES)</label>
<input type="number" name="contribution_amount" class="form-control" value="2000" min="100"></div>
<div class="mb-3"><label class="form-label">Contribution day of month</label>
<input type="number" name="contribution_day" class="form-control" value="5" min="1" max="28"></div>
<div class="mb-3"><label class="form-label">Loan interest %</label>
<input type="number" name="loan_interest_rate" class="form-control" value="5" step="0.5"></div>
<button class="btn btn-primary w-100">Create & start trial</button>
</form>
</div></div></div>
{% endblock %}
