{% extends "base.html" %}
{% block title %}Login - ChamaPay{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<div class="card p-4">
<h4 class="mb-3">Login</h4>
<form method="POST">
<div class="mb-3"><label class="form-label">Phone</label>
<input type="tel" name="phone" class="form-control" placeholder="07XXXXXXXX" required autofocus></div>
<div class="mb-3"><label class="form-label">Password</label>
<input type="password" name="password" class="form-control" required></div>
<button class="btn btn-primary w-100">Login</button>
</form>
<p class="mt-3 small text-center">No account? <a href="{{ url_for('register') }}">Register</a></p>
</div></div></div>
{% endblock %}
