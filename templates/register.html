{% extends "base.html" %}
{% block title %}Register - ChamaPay{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<div class="card p-4">
<h4 class="mb-3">Create account</h4>
<form method="POST">
<div class="mb-3"><label class="form-label">Full name</label>
<input type="text" name="name" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Phone (M-Pesa number)</label>
<input type="tel" name="phone" class="form-control" placeholder="07XXXXXXXX" required></div>
<div class="mb-3"><label class="form-label">Password</label>
<input type="password" name="password" class="form-control" minlength="6" required></div>
<div class="mb-3"><label class="form-label">Confirm password</label>
<input type="password" name="confirm_password" class="form-control" required></div>
<button class="btn btn-primary w-100">Register</button>
</form>
<p class="mt-3 small text-center">Have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div></div></div>
{% endblock %}
